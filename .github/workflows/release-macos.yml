name: Desktop and relay release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag, for example v0.2.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux
          - runner: macos-15
            artifact: macos
          - runner: ubuntu-24.04-arm
            artifact: relay-arm64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            artifact: relay-amd64
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            artifact: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Validate tag syntax
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # Rust 1.89.0
        with:
          components: rustfmt, clippy
      - name: Check annotated tag and version
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v$(python tools/macos_release.py version)"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libarchive-tools librsvg2-common squashfs-tools
      - name: Source and package checks
        shell: bash
        run: |
          bash tools/check.sh
          python tools/test_release_packages.py
      - name: Compare portable replay digest
        shell: bash
        run: |
          mkdir -p build
          cargo run --locked -p bomberman-net --example replay_digest > build/replay-digest.txt
          python tools/verify_replay_digest.py build/replay-digest.txt
      - name: Linux launcher and AppImage
        if: matrix.artifact == 'linux'
        run: |
          python3 tools/test_linux_launcher.py
          tools/package_linux.sh --release
          python3 tools/test_appimage_bootstrap.py dist/github/*.AppImage
      - name: Mac launcher and ZIP
        if: matrix.artifact == 'macos'
        run: |
          tools/test_macos_launcher.sh
          tools/package_macos.sh --release
      - name: Native Linux relay
        if: startsWith(matrix.artifact, 'relay-')
        run: |
          cargo build --locked --release -p bomberman-relay
          target/release/bomberman-relay --help
          python3 tools/package_relay.py --target "${{ matrix.target }}" --release
      - name: Windows launcher and portable ZIP
        if: matrix.artifact == 'windows'
        shell: bash
        run: |
          cargo build --locked --release -p bomberman-windows-launcher
          python tools/test_windows_launcher.py
          python tools/windows_release.py build --release
          cargo build --locked --release -p bomberman-relay
          cargo build --locked --release -p bomberman --example network_latency
          python tools/verify_datagram.py --relay target/release/bomberman-relay.exe --example target/release/examples/network_latency.exe --report build/windows-release-quic.json
      - name: Relay gameplay over QUIC
        if: startsWith(matrix.artifact, 'relay-')
        run: |
          cargo build --locked --release -p bomberman --example network_latency
          python3 tools/verify_datagram.py --relay target/release/bomberman-relay --example target/release/examples/network_latency --report build/release-quic.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: dist/github/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all artifacts and publish release
        shell: bash
        run: |
          export RELEASE_COMMIT=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.type)" = tag
          python3 tools/verify_release.py --directory release --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --notes release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" release/*.AppImage release/*.zip release/*.tar.gz release/*.sha256 release/*.build.json \
            --verify-tag --latest --title "Atomic Bomberman ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
