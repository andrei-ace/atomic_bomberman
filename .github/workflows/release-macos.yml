name: Desktop and relay release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag, for example v0.2.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux
          - runner: macos-15
            artifact: macos
          - runner: ubuntu-24.04-arm
            artifact: relay
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Validate tag syntax
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # Rust 1.89.0
        with:
          components: rustfmt, clippy
      - name: Check annotated tag and version
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v$(python3 tools/macos_release.py version)"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libarchive-tools librsvg2-common squashfs-tools
      - run: tools/check.sh
      - name: Compare portable replay digest
        shell: bash
        run: |
          mkdir -p build
          cargo run --locked -p bomberman-net --example replay_digest > build/replay-digest.txt
          diff docs/evidence/network-replay-digest.txt build/replay-digest.txt
      - name: Linux launcher and AppImage
        if: matrix.artifact == 'linux'
        run: |
          python3 tools/test_linux_launcher.py
          tools/package_linux.sh --release
          python3 tools/test_appimage_bootstrap.py dist/github/*.AppImage
      - name: Mac launcher and ZIP
        if: matrix.artifact == 'macos'
        run: |
          tools/test_macos_launcher.sh
          tools/package_macos.sh --release
      - name: Native ARM64 relay
        if: matrix.artifact == 'relay'
        run: |
          cargo build --locked --release -p bomberman-relay
          target/release/bomberman-relay --help
          python3 tools/package_relay.py --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: dist/github/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all artifacts and create draft
        working-directory: release
        shell: bash
        run: |
          sha256sum -c ./*.sha256
          export RELEASE_COMMIT=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          targets = set()
          manifests = sorted(Path('.').glob('*.build.json'))
          assert len(manifests) == 3, 'expected Mac, Linux and ARM64 relay'
          for path in manifests:
              info = json.loads(path.read_text())
              assert info['version'] == version
              assert info['source']['dirty'] is False
              assert info['source']['commit'] == os.environ['RELEASE_COMMIT'], 'tag moved after build'
              assert info['original_game_data_included'] is False
              targets.add(info['target'])
          assert targets == {'aarch64-apple-darwin', 'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu'}
          Path('release-notes.md').write_text(
              f"Atomic Bomberman {version}, built from `{os.environ['RELEASE_COMMIT']}`.\n\n"
              "Download the Linux AppImage or Apple Silicon Mac ZIP and its checksum. "
              "Both import your original game data on first launch. Original data and private "
              "relay endpoints are excluded. The Mac app is ad-hoc signed and not notarized.\n\n"
              "The ARM64 relay archive includes the native service, systemd unit, setup "
              "instructions, licenses and provenance. Configure its address privately during setup.\n\n"
              "All three artifacts come from the same tagged commit and include build metadata.\n")
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.AppImage ./*.zip ./*.tar.gz ./*.sha256 ./*.build.json \
            --verify-tag --draft --prerelease --title "Atomic Bomberman ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
