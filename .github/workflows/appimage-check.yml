name: AppImage compatibility and catalog check
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      ref:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            distribution: ubuntu:22.04
          - name: ubuntu-24.04
            distribution: ubuntu:24.04
          - name: ubuntu-26.04
            distribution: ubuntu:26.04
          - name: debian-12
            distribution: debian:12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: build/appimage-candidate
      - name: Test the same AppImage without network, host GTK or FUSE
        run: |
          set -- build/appimage-candidate/atomic-bomberman-*-x86_64.AppImage
          test "$#" -eq 1 && test -f "$1"
          mkdir -p build/appimage-compatibility
          docker build --build-arg DISTRIBUTION=${{ matrix.distribution }} -t atomic-appimage-compat - < tools/appimage-test.Dockerfile
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" -v "$PWD/build/appimage-compatibility:/output" \
            atomic-appimage-compat xvfb-run -a -s '-screen 0 1024x768x24' \
            python3 tools/test_appimage_compatibility.py "/workspace/$1" --output /output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: appimage-${{ matrix.name }}
          path: build/appimage-compatibility/
  catalog:
    needs: compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: build/appimage-candidate
      - name: Run the actual AppImageHub PR checker last
        run: |
          set -- build/appimage-candidate/atomic-bomberman-*-x86_64.AppImage
          test "$#" -eq 1 && test -f "$1"
          python3 tools/check_appimage_catalog.py "$1" --install-dependencies --output build/appimage-catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: appimage-catalog
          path: build/appimage-catalog/
