name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # Rust 1.89.0
        with:
          components: rustfmt, clippy
      - run: tools/check.sh
      - run: tools/test_macos_launcher.sh
      - run: cargo build --locked --release --workspace
      - name: Package Apple Silicon app
        if: matrix.runner == 'macos-15'
        run: tools/package_macos.sh --release
      - name: Upload Apple Silicon app
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomic-bomberman-macos-arm64
          path: dist/github/*
          if-no-files-found: error
