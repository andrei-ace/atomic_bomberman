[package]
name = "bomberman-core"
version = "0.1.0"
edition = "2021"
description = "Rendering-independent deterministic Atomic Bomberman battle simulation"
license = "MIT"

[features]
native-comparison = []

[[example]]
name = "match_ai_fixture"
required-features = ["native-comparison"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
