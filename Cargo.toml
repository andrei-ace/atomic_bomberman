[workspace]
members = ["crates/bomberman-core", "crates/bomberman-assets", "crates/bomberman"]
exclude = ["vendor/quad-snd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
png = "0.17"
macroquad = { version = "=0.4.16", features = ["audio"] }
gilrs = "=0.11.2"
bomberman-core = { path = "crates/bomberman-core" }
bomberman-assets = { path = "crates/bomberman-assets" }

[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
