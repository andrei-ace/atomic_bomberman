[workspace]
members = ["crates/bomberman-core", "crates/bomberman-assets", "crates/bomberman-net", "crates/bomberman-relay", "crates/bomberman"]
exclude = ["vendor/quad-snd", "vendor/miniquad"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
png = "0.17"
macroquad = { version = "=0.4.16", features = ["audio"] }
gilrs = "=0.11.2"
bomberman-core = { path = "crates/bomberman-core" }
bomberman-assets = { path = "crates/bomberman-assets" }
bomberman-net = { path = "crates/bomberman-net" }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.3", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-tungstenite = { version = "=0.27.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.31", features = ["sink"] }
base64 = "=0.22.1"
rand = "=0.8.5"
subtle = "=2.6.1"
url = "=2.5.7"

[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
miniquad = { path = "vendor/miniquad" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
